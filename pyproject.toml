[project]
name = "trade-sentinel"
version = "0.4.0"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "aiosqlite>=0.20", "httpx>=0.27", "pandas>=2.2", "numpy>=2.0", "pydantic-settings>=2.5", "yfinance>=0.2.54"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# Dense single-line style is intentional in the app layer; imports there often
# appear mid-file after route decorators in tests. Keep the check useful but
# pragmatic.
"app/*" = ["E401", "I001"]