[project]
name = "trade-sentinel"
version = "0.4.0"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "aiosqlite>=0.20", "httpx>=0.27", "pandas>=2.2", "numpy>=2.0", "pydantic-settings>=2.5", "yfinance>=0.2.54"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]