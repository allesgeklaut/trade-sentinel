services:
  trade-sentinel:
    build: .
    container_name: trade-sentinel
    restart: unless-stopped
    ports: ["8002:8000"]
    env_file:
      - .env
    volumes:
      - trade_sentinel_data:/data
      # Single source of truth for the LiteLLM API key. Mounted read-only and
      # read by the app via LITELLM_API_KEY_FILE (below) — the key is NOT
      # copied into any env file.
      - /opt/secrets/litellm.key:/run/secrets/litellm.key:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Europe/Vienna
      - LITELLM_API_KEY_FILE=/run/secrets/litellm.key
volumes:
  trade_sentinel_data:
