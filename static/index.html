<!doctype html><html><head><meta charset="utf-8"><title>Trade Sentinel</title><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script><style>body{margin:0;background:#050a07;color:#b7ffc0;font:14px ui-monospace,monospace}header,main{max-width:1300px;margin:auto;padding:18px}header{border-bottom:1px solid #1d6030;display:flex;justify-content:space-between}button,input{background:#09140c;color:#b7ffc0;border:1px solid #318e43;padding:8px}button{cursor:pointer}main{display:grid;grid-template-columns:230px 1fr;gap:18px}.panel{border:1px solid #1d6030;padding:14px;background:#071009}.ticker{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #12351c;cursor:pointer}.buy{color:#42ff72}.sell{color:#ff5c70}.hold{color:#ffd65c}#chart{height:420px}.metric{display:inline-block;border:1px solid #1d6030;padding:10px;margin:5px;min-width:90px}pre{white-space:pre-wrap;line-height:1.5}</style></head><body><header><b>TRADE SENTINEL // PAPER-ONLY RESEARCH TERMINAL</b><span id="status">loading</span></header><main><aside class="panel"><form id="add"><input id="new" placeholder="Ticker"><button>Add</button></form><div id="watch"></div></aside><section><div class="panel"><button onclick="refreshData()">Refresh data</button> <button onclick="explain()">Ask local LLM</button> <b id="ticker"></b><div id="signal"></div><div id="chart"></div></div><div class="panel"><b>AI EXPLANATION</b><pre id="ai">Select a symbol, then ask Ollama for a read-only explanation.</pre></div></section></main><script>let current,chart;const $=s=>document.querySelector(s);async function api(p,o){let r=await fetch('/api/'+p,o);if(!r.ok)throw Error(await r.text());return r.json()}async function loadWatch(){let a=await api('watchlist');$('#watch').innerHTML=a.map(t=>`<div class=ticker onclick="openTicker('${t}')">${t}<button onclick="event.stopPropagation();del('${t}')">x</button></div>`).join('');if(!current&&a[0])openTicker(a[0])}async function openTicker(t){current=t;$('#ticker').textContent=' // '+t;try{let d=await api('dashboard/'+t);draw(d);$('#status').textContent='ONLINE // '+t}catch(e){$('#status').textContent='ERROR: refresh required';$('#signal').textContent=e.message}}function draw(d){let s=d.snapshot;$('#signal').innerHTML=`<h2 class="${d.action.toLowerCase()}">${d.action}</h2><p>${d.reason}</p>`+Object.entries(s).map(([k,v])=>`<span class=metric>${k}<br><b>${v}</b></span>`).join('');$('#chart').innerHTML='';chart=LightweightCharts.createChart($('#chart'),{height:420,layout:{background:{color:'#071009'},textColor:'#b7ffc0'},grid:{vertLines:{color:'#12351c'},horzLines:{color:'#12351c'}}});chart.addCandlestickSeries({upColor:'#42ff72',downColor:'#ff5c70',borderVisible:false,wickUpColor:'#42ff72',wickDownColor:'#ff5c70'}).setData(d.candles);chart.timeScale().fitContent()}async function refreshData(){try{$('#status').textContent='FETCHING...';await api('refresh/'+current,{method:'POST'});await openTicker(current);$('#status').textContent='ONLINE'}catch(e){$('#status').textContent=e.message}}async function explain(){$('#ai').textContent='Querying local Ollama...';let x=await api('explain/'+current,{method:'POST'});$('#ai').textContent=x.text}async function del(t){await api('watchlist/'+t,{method:'DELETE'});current=null;loadWatch()}$('#add').onsubmit=async e=>{e.preventDefault();let t=$('#new').value.trim();if(t){await api('watchlist/'+t,{method:'POST'});$('#new').value='';loadWatch()}};loadWatch()</script></body></html>
